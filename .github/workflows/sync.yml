name: sync-applied
# Manual: pull applied-state from the Applied sheet and commit it — lets the
# sheet link be verified (matched / unmatched rows) without sending a digest.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: {group: radar, cancel-in-progress: false}   # SAME literal group — load-bearing
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run radar sync-applied
        env:
          PYTHONUNBUFFERED: '1'
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
      - name: persist state
        if: ${{ always() }}
        run: |
          uv run python -c "import sqlite3; sqlite3.connect('data/jobs.db').execute('PRAGMA integrity_check')" || true
          rm -f data/jobs.db-journal
          git config user.name radar-bot
          git config user.email bot@users.noreply.github.com
          git add data/jobs.db
          git diff --cached --quiet && exit 0
          git commit -m "state: sync-applied $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin "$GITHUB_REF_NAME"
            git rebase -X theirs "origin/$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
          done
          exit 1
