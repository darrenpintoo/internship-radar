name: bootstrap
# One-time (or re-runnable) backlog enrichment at the bootstrap cap, flash
# alerts suppressed (SPEC §11 M2). Manual trigger only.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: {group: radar, cancel-in-progress: false}   # SAME literal group as poll/digest — load-bearing
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run radar bootstrap
        env:
          PYTHONUNBUFFERED: '1'
          RADAR_LLM_WORKERS: ${{ vars.RADAR_LLM_WORKERS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RADAR_OPENROUTER_MODEL: ${{ vars.RADAR_OPENROUTER_MODEL }}
          RADAR_TARGET: ${{ vars.RADAR_TARGET }}
          RADAR_WORKAUTH_OK: ${{ vars.RADAR_WORKAUTH_OK }}
          DIGEST_MIN_FIT: ${{ vars.DIGEST_MIN_FIT }}
          DIGEST_HIDE_CATEGORIES: ${{ vars.DIGEST_HIDE_CATEGORIES }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADAR_LLM_PROVIDER: ${{ vars.RADAR_LLM_PROVIDER }}
          RADAR_OPENAI_MODEL: ${{ vars.RADAR_OPENAI_MODEL }}
          BOOTSTRAP_MAX_LLM_CALLS: ${{ vars.BOOTSTRAP_MAX_LLM_CALLS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: persist state
        if: ${{ always() }}          # a timeout/cancel must never discard finished work
        run: |
          # replay any hot journal left by a killed process before committing the file
          uv run python -c "import sqlite3; sqlite3.connect('data/jobs.db').execute('PRAGMA integrity_check')" || true
          rm -f data/jobs.db-journal
          git config user.name radar-bot
          git config user.email bot@users.noreply.github.com
          git add data/jobs.db
          git diff --cached --quiet && exit 0
          git commit -m "state: bootstrap $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin "$GITHUB_REF_NAME"
            git rebase -X theirs "origin/$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
          done
          exit 1
