name: poll
on:
  schedule: [{cron: "17 */3 * * *"}]   # offset minute: politeness + avoids the on-the-hour stampede
  workflow_dispatch: {}
permissions:
  contents: write                       # REQUIRED: default token is read-only; push 403s without this
# Literal group 'radar' MUST match digest.yml — the shared group serializes all
# writers of data/jobs.db (SPEC §9). Load-bearing; do not "adapt" per workflow.
concurrency: {group: radar, cancel-in-progress: false}
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4       # fetch-depth 1 is fine for the rebase below
      - uses: astral-sh/setup-uv@v4
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run radar poll
        env:
          PYTHONUNBUFFERED: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADAR_LLM_PROVIDER: ${{ vars.RADAR_LLM_PROVIDER }}
          RADAR_LLM_WORKERS: ${{ vars.RADAR_LLM_WORKERS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RADAR_OPENROUTER_MODEL: ${{ vars.RADAR_OPENROUTER_MODEL }}
          RADAR_TARGET: ${{ vars.RADAR_TARGET }}
          RADAR_WORKAUTH_OK: ${{ vars.RADAR_WORKAUTH_OK }}
          DIGEST_MIN_FIT: ${{ vars.DIGEST_MIN_FIT }}
          DIGEST_HIDE_CATEGORIES: ${{ vars.DIGEST_HIDE_CATEGORIES }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}    # flash alerts send from poll runs
          DIGEST_TO: ${{ vars.DIGEST_TO }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
      # Pushes made with the built-in GITHUB_TOKEN do not trigger push-event
      # workflows — THAT is the recursion guard; [skip ci] is insurance for a
      # future PAT swap. Bot commits also keep the repo "active" for the 60-day
      # scheduled-workflow auto-disable rule (SPEC §9).
      - name: persist state
        if: ${{ always() }}          # a timeout/cancel must never discard finished work
        run: |
          # replay any hot journal left by a killed process before committing the file
          uv run python -c "import sqlite3; sqlite3.connect('data/jobs.db').execute('PRAGMA integrity_check')" || true
          rm -f data/jobs.db-journal
          git config user.name radar-bot
          git config user.email bot@users.noreply.github.com
          git add data/jobs.db
          git diff --cached --quiet && exit 0
          git commit -m "state: poll $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin "$GITHUB_REF_NAME"
            # binary sqlite can't merge; -X theirs during rebase keeps THIS runner's DB
            git rebase -X theirs "origin/$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
          done
          exit 1
