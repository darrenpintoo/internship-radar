[project]
name = "internship-radar"
version = "0.1.0"
description = "Single-user internship posting aggregator — see SPEC.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "feedparser>=6.0.11",
    "jinja2>=3.1",
    "rapidfuzz>=3.9",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Blind `except Exception` is deliberate at adapter/pipeline boundaries
# (SPEC §5.1: one source's failure never kills the run) — so BLE stays off.
# RUF001-003 (ambiguous unicode) is off: Unicode dashes/quotes are load-bearing
# here — real ATS titles carry en-dashes and normalize.py exists to handle them.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
